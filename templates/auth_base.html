{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UniVerse | {% block title %}{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    {% block extra_head %}{% endblock %}
</head>

<body
    class="min-h-screen bg-no-repeat bg-center bg-cover"
    style="background-image: url('{% static 'images/background.png' %}');"
>

    <!-- ================= MESSAGES ================= -->
    {% if messages %}
      <div class="max-w-md mx-auto mt-6 space-y-2">
        {% for message in messages %}
          <div class="px-4 py-2 rounded shadow
                      {% if message.tags == 'error' %}bg-red-100 text-red-700{% endif %}
                      {% if message.tags == 'success' %}bg-green-100 text-green-700{% endif %}
                      {% if message.tags == 'warning' %}bg-yellow-100 text-yellow-700{% endif %}
                      {% if message.tags == 'info' %}bg-blue-100 text-blue-700{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
    
    {% block script %}{% endblock %}
</body>

</html>
